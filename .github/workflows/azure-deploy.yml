
name: Deploy Website to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload website files
        run: |
          az storage blob upload \
            --account-name az900storagevinushan01 \
            --container-name '$web' \
            --name index.html \
            --file index.html \
            --overwrite \
            --auth-mode login

          az storage blob upload \
            --account-name az900storagevinushan01 \
            --container-name '$web' \
            --name style.css \
            --file style.css \
            --overwrite \
            --auth-mode login
